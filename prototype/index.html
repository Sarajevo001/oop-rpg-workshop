<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RPGハンズオン 試作</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./game.js" defer></script>
</head>
<body>
  <main>
    <h1>RPGハンズオン 試作</h1>
    <p>4章の設計要素を確認するための最小限の戦闘画面です。</p>
    <section aria-label="戦闘状態"><h2>戦闘状態</h2><div id="status"></div></section>
    <section aria-label="行動"><h2>行動</h2><div id="actions"></div></section>
    <section aria-label="ログ"><h2>ログ</h2><ol id="log" aria-live="polite"></ol></section>
    <button id="reset" type="button">最初から</button>
  </main>
</body>
</html>
