<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第2章 連続性検証</title><style>body{font:16px system-ui;max-width:750px;margin:2rem auto;padding:0 1rem}section{border:1px solid #ddd;border-radius:8px;padding:1rem;margin:1rem 0}button{margin:.25rem;padding:.5rem}#log{min-height:2rem}</style></head><body><h1>第2章 連続性検証</h1><p>第1章の敵3体・共通ダメージ計算を保持したまま、味方を複数に増やした例。</p><section><h2>味方</h2><div id="allies"></div></section><section><h2>敵</h2><div id="enemies"></div></section><section><h2>行動</h2><div id="actions"></div></section><section><h2>ログ</h2><div id="log" aria-live="polite"></div></section><button id="reset">やり直す</button><script>// 第1章から引き継いだ計算規則
function calculateDamage(attack, defense) { return Math.max(1, attack - defense * 2); }
const enemies = [
 { name:"スライム", hp:15, defense:1 },
 { name:"ゴブリン", hp:20, defense:2 },
 { name:"オーク", hp:28, defense:3 }
];
// 第2章の検証: まず並列配列で味方を増やした実装
const names = ["勇者","僧侶","戦士"];
const hps = [30,18,24];
const maxHps = [30,18,24];
const attacks = [8,4,7];
const defenses = [2,1,3];
const alliesView=document.querySelector("#allies");
const enemyView=document.querySelector("#enemies");
const actionsView=document.querySelector("#actions");
const logView=document.querySelector("#log");
function log(message) { logView.textContent=message; }
function attackEnemy(allyIndex,enemyIndex) {
 const enemy=enemies[enemyIndex];
 if (hps[allyIndex]<=0 || enemy.hp<=0) return;
 const damage=Math.min(enemy.hp,calculateDamage(attacks[allyIndex],enemy.defense));
 enemy.hp-=damage;
 log(`${names[allyIndex]}が${enemy.name}に${damage}ダメージ！`);
 render();
}
function healAlly(index) {
 if(hps[index]<=0) return;
 const amount=Math.min(5,maxHps[index]-hps[index]);
 hps[index]+=amount;
 log(`${names[index]}が${amount}回復`);
 render();
}
function render() {
 alliesView.replaceChildren(); enemyView.replaceChildren(); actionsView.replaceChildren();
 for(let i=0;i<names.length;i++) {
  const label=document.createElement("div");
  label.textContent=`${names[i]} HP ${hps[i]}/${maxHps[i]} 攻撃 ${attacks[i]} 防御 ${defenses[i]}`;
  alliesView.append(label);
  const heal=document.createElement("button");
  heal.textContent=`${names[i]}を回復`; heal.disabled=hps[i]<=0 || hps[i]===maxHps[i];
  heal.addEventListener("click",()=>healAlly(i));actionsView.append(heal);
 }
 for(let j=0;j<enemies.length;j++) {
  const enemy=enemies[j];
  const label=document.createElement("div");label.textContent=`${enemy.name} HP ${enemy.hp}`;enemyView.append(label);
  for(let i=0;i<names.length;i++) {
   const button=document.createElement("button");
   button.textContent=`${names[i]} → ${enemy.name}`;
   button.disabled=enemy.hp<=0 || hps[i]<=0;
   button.addEventListener("click",()=>attackEnemy(i,j));
   actionsView.append(button);
  }
 }
}
document.querySelector("#reset").addEventListener("click",()=>location.reload());
render();</script></body></html>
