<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第2章 並列配列</title><style>body{font:16px system-ui;max-width:720px;margin:2rem auto;padding:0 1rem}button{margin:.3rem;padding:.6rem}section{border:1px solid #ccc;border-radius:8px;padding:1rem;margin:1rem 0}#log{white-space:pre-line}</style></head><body><h1>第2章 並列配列</h1><p>第1章で導入した共通ダメージ計算を引き継いでいます。</p><section><h2>味方</h2><div id="allies"></div></section><section><h2>敵</h2><div id="enemies"></div></section><section><h2>操作</h2><div id="actions"></div></section><section><h2>ログ</h2><div id="log" aria-live="polite"></div></section><button id="reset">最初から</button><script>function calculateDamage(attack, defense) { return Math.max(1, attack - defense * 2); }
const enemy = { name: "スライム", hp: 30, defense: 1 };
const logView = document.querySelector("#log");
function writeLog(message) { logView.textContent = message; }
function showEnemy() { document.querySelector("#enemies").textContent = `${enemy.name} HP ${enemy.hp}`; }
function makeButton(label, onClick) { const b = document.createElement("button"); b.textContent=label; b.addEventListener("click",onClick); document.querySelector("#actions").append(b); }
document.querySelector("#reset").addEventListener("click",()=>location.reload());
// 章の開始状態: 名前・HP・攻撃力・防御力が別々の配列にある。
const names = ["勇者", "僧侶"];
const hps = [30, 18];
const maxHps = [30, 18];
const attacks = [8, 4];
const defenses = [2, 1];
function showAllies() {
  document.querySelector("#allies").textContent =
    names.map((name,i)=>`${name} HP ${hps[i]}/${maxHps[i]}`).join(" / ");
}
function attack(index) {
  if (enemy.hp <= 0 || hps[index] <= 0) return;
  const damage = Math.min(enemy.hp, calculateDamage(attacks[index],enemy.defense));
  enemy.hp -= damage;
  writeLog(`${names[index]}の攻撃！ ${damage}ダメージ`);
  showEnemy();
}
function heal(index) {
  const amount = Math.min(5,maxHps[index]-hps[index]);
  hps[index] += amount;
  writeLog(`${names[index]}が${amount}回復`);
  showAllies();
}
makeButton("勇者で攻撃",()=>attack(0));
makeButton("僧侶で攻撃",()=>attack(1));
makeButton("勇者を回復",()=>heal(0));
makeButton("僧侶を回復",()=>heal(1));
showAllies(); showEnemy();</script></body></html>
