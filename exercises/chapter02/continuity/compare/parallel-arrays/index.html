<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第2章 連続性検証</title><style>body{font:16px system-ui;max-width:750px;margin:2rem auto;padding:0 1rem}section{border:1px solid #ddd;border-radius:8px;padding:1rem;margin:1rem 0}button{margin:.25rem;padding:.5rem}#log{min-height:2rem}</style></head><body><h1>第2章 連続性検証</h1><p>第1章の敵3体・共通ダメージ計算を保持したまま、味方を複数に増やした例。</p><section><h2>味方</h2><div id="allies"></div></section><section><h2>敵</h2><div id="enemies"></div></section><section><h2>行動</h2><div id="actions"></div></section><section><h2>ログ</h2><div id="log" aria-live="polite"></div></section><button id="reset">やり直す</button><script>function calculateDamage(attack,defense){return Math.max(1,attack-defense*2)}
const enemies=[{name:"スライム",hp:15,defense:1,attack:4},{name:"ゴブリン",hp:20,defense:2,attack:5},{name:"オーク",hp:28,defense:3,attack:6}];
const alliesView=document.querySelector("#allies"),enemyView=document.querySelector("#enemies"),actionsView=document.querySelector("#actions"),logView=document.querySelector("#log");
function log(message){logView.textContent=message}
function addButton(label,fn,disabled=false){const b=document.createElement("button");b.textContent=label;b.disabled=disabled;b.addEventListener("click",fn);actionsView.append(b)}
document.querySelector("#reset").addEventListener("click",()=>location.reload());
// 5配列の同じ添字が1人を表す。追加・削除では必ず全配列を同期する。
const names=["勇者","僧侶","戦士"];
const hps=[30,18,24],maxHps=[30,18,24],attacks=[8,4,7],defenses=[2,1,3];
let nextNumber=1;
function addAlly(){
 names.push("新入り"+nextNumber++);hps.push(20);maxHps.push(20);attacks.push(5);defenses.push(2);
 log("味方を追加しました");render();
}
function removeAlly(i){
 if(names.length===1){log("最後の味方は削除できません");return}
 const name=names[i];
 names.splice(i,1);hps.splice(i,1);maxHps.splice(i,1);attacks.splice(i,1);defenses.splice(i,1);
 log(name+"を編成から外しました");render();
}
function enemyTurn(){
 const attacker=enemies.find(e=>e.hp>0);
 const target=hps.findIndex(hp=>hp>0);
 if(!attacker||target<0)return;
 const damage=Math.min(hps[target],calculateDamage(attacker.attack,defenses[target]));
 hps[target]-=damage;
 log(logView.textContent+" / "+attacker.name+"の反撃: "+names[target]+"に"+damage+"ダメージ");
}
function attackEnemy(i,j){
 if(hps[i]<=0||enemies[j].hp<=0)return;
 const damage=Math.min(enemies[j].hp,calculateDamage(attacks[i],enemies[j].defense));
 enemies[j].hp-=damage;log(names[i]+"の攻撃: "+enemies[j].name+"に"+damage+"ダメージ");
 enemyTurn();render();
}
function healAlly(i){
 if(hps[i]<=0){log("戦闘不能の味方は回復できません");return}
 const amount=Math.min(5,maxHps[i]-hps[i]);hps[i]+=amount;
 log(names[i]+"が"+amount+"回復");enemyTurn();render();
}
function render(){
 alliesView.replaceChildren();enemyView.replaceChildren();actionsView.replaceChildren();
 for(let i=0;i<names.length;i++){
  const d=document.createElement("div");d.textContent=names[i]+" HP "+hps[i]+"/"+maxHps[i]+(hps[i]===0?" [戦闘不能]":"");alliesView.append(d);
  addButton(names[i]+"を回復",()=>healAlly(i),hps[i]===0||hps[i]===maxHps[i]);
  addButton(names[i]+"を外す",()=>removeAlly(i),names.length===1);
 }
 addButton("味方を追加",addAlly);
 for(let j=0;j<enemies.length;j++){
  const e=enemies[j],d=document.createElement("div");d.textContent=e.name+" HP "+e.hp;enemyView.append(d);
  for(let i=0;i<names.length;i++)addButton(names[i]+" → "+e.name,()=>attackEnemy(i,j),e.hp===0||hps[i]===0);
 }
}
render();</script></body></html>
