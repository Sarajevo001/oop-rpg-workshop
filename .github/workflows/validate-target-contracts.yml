name: Validate RPG target contracts
on:
  push:
  pull_request:
    branches:
      - main
jobs:
  target-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify shared stage files and material links
        run: python3 tests/verify_shared_materials.py
      - name: Verify readable source and presentation excerpts
        run: python3 tests/verify_readable_materials.py
      - name: Syntax check all JavaScript examples
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find src/public/examples -name '*.js' -print0)
      - name: Test normal and abnormal target selection
        run: node tests/target-contracts.cjs
      - name: Install pinned browser test dependency
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # Fixed baseline for this readability migration only.
      - name: Fetch readability migration baseline
        if: github.ref == 'refs/heads/feature-readable-rpg-layout' || (github.ref == 'refs/heads/main' && github.event.before == '2be5b89807b8158db41707ad8915d16f4ea2d89c')
        run: git fetch --no-tags --depth=1 origin 23e3cc3d1e36ffa8e38b4f9cf9948e48159a1542
      - name: Test actual Chromium rendering and file saving
        env:
          RPG_BEHAVIOR_BASELINE: ${{ (github.ref == 'refs/heads/feature-readable-rpg-layout' || (github.ref == 'refs/heads/main' && github.event.before == '2be5b89807b8158db41707ad8915d16f4ea2d89c')) && '23e3cc3d1e36ffa8e38b4f9cf9948e48159a1542' || '' }}
        run: node tests/browser-materials.cjs
