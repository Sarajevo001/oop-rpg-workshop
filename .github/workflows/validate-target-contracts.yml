name: Validate RPG target contracts
on:
  push:
    branches:
      - review/standards-1-6-0-20261115
      - main
  pull_request:
    branches:
      - main
jobs:
  target-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check all JavaScript examples
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find src/public/examples -name '*.js' -print0)
      - name: Test normal and abnormal target selection
        run: node tests/target-contracts.cjs
