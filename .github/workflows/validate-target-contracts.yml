name: Validate RPG target contracts
on:
  push:
  pull_request:
    branches:
      - main
jobs:
  target-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify shared stage files and material links
        run: python3 tests/verify_shared_materials.py
      - name: Syntax check all JavaScript examples
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find src/public/examples -name '*.js' -print0)
      - name: Test normal and abnormal target selection
        run: node tests/target-contracts.cjs
      - name: Install pinned browser test dependency
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test actual Chromium rendering and file saving
        run: node tests/browser-materials.cjs
